  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/entities/course.json", save_as = "data/entities/course.json" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/entities/teacher.json", save_as = "data/entities/teacher.json" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/entities/school.json", save_as = "data/entities/school.json" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/course-field.json", save_as = "data/relations/course-field.json" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/course-teacher.txt", save_as = "data/relations/course-teacher.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/concept-course.txt", save_as = "data/relations/concept-course.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/concept-other.txt", save_as = "data/relations/concept-other.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/concept-problem.txt", save_as = "data/relations/concept-problem.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/concept-comment.txt", save_as = "data/relations/concept-comment.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/user-xiaomu.json", save_as = "data/relations/user-xiaomu.json" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/user-reply.txt", save_as = "data/relations/user-reply.txt" },
  { url = "https://lfs.aminer.cn/misc/moocdata/data/mooccube2/relations/comment-reply.txt", save_as = "data/relations/comment-reply.txt" },
]
expect = [
  { path = "README.md" },
  { path = "data/entities/*.json", min_count = 3 },
  { path = "data/relations/*", min_count = 9 },
]

