[[dataset]]
name = "pisa-2022"
title = "PISA 2022 (OECD): school and teacher questionnaires, ESCS trend"
dir = "pisa-2022"
# webfs.oecd.org avoids the bot protection on www.oecd.org
files = [
  { url = "https://webfs.oecd.org/pisa2022/SCH_QQQ_SPSS.zip", save_as = "SCH_QQQ_SPSS.zip", extract = true },
  { url = "https://webfs.oecd.org/pisa2022/TCH_QQQ_SPSS.zip", save_as = "TCH_QQQ_SPSS.zip", extract = true },
  { url = "https://webfs.oecd.org/pisa2022/escs_trend.zip", save_as = "escs_trend.zip", extract = true },
]
expect = [
  { path = "**/CY08MSP_SCH_QQQ.SAV" },
  { path = "**/CY08MSP_TCH_QQQ.SAV" },
  { path = "**/escs_trend.csv" },
  { path = "**/ReadMe.txt" },
]

[[dataset]]
name = "talis-2024"
title = "TALIS 2024 (OECD): principal and teacher questionnaires"
dir = "talis-2024"
# webfs.oecd.org throttles single connections (~60 KB/s): fetch_datasets.py splits
# large files into parallel HTTP range requests (--workers)
files = [
  { url = "https://webfs.oecd.org/talis/2024/core/TALIS2024_principals_NoESE_CSV.zip", save_as = "TALIS2024_principals_NoESE_CSV.zip", extract = true },
  { url = "https://webfs.oecd.org/talis/2024/core/TALIS2024_teachers_NoESE_CSV.zip", save_as = "TALIS2024_teachers_NoESE_CSV.zip", extract = true },
]
expect = [
  { path = "**/acgintt4.csv" }, { path = "**/bcgintt4.csv" }, { path = "**/ccgintt4.csv" }, { path = "**/tcgintt4.csv" },
  { path = "**/atgintt4.csv" }, { path = "**/btgintt4.csv" }, { path = "**/ctgintt4.csv" }, { path = "**/ttgintt4.csv" },
]
