# English language pack: the source language of every report (section files NN-SS-slug.md).
# A pack folder holds pack.toml and, for a target language, guide.md, glossaries/ and templates/ (see vi/).

code = "en"
name = "English"
locale = "en-GB"                 # Word language tag (spelling, hyphenation, core properties)
suffix = ".md"                   # section files of this language: NN-SS-slug.md

# Word front matter
contents = "Contents"
lof = "List of Figures"
lot = "List of Tables"
hint = "Contents are generated by Word. If they look empty, right-click here and choose Update Field."

# Words used in captions, cross-references and special headings (singular first, then plural)
figure = ["Figure", "Figures"]
table = ["Table", "Tables"]
section = ["Section", "Sections"]
part = ["Part", "Parts"]
appendix = ["Appendix", "Appendices"]
connectors = [", and ", ", ", " and ", " to ", " or ", "–"]   # between numbers in "Sections 1.2 and 1.3"
references = ["References"]                                   # H1 of the reference list
abbreviation_header = ["Abbreviation"]                        # first header cell of the abbreviation table

# Frequent function words: a target-language line dense with these reads as untranslated source text
function_words = ["the", "and", "of", "with", "which", "that", "is", "are", "for", "from", "this", "each", "when"]

# Reader-focused style, checked in every English section by check_style.py (quotations, code and references exempt)
[style]
meta_phrases = ["this report will", "the reader", "we will", "in this task", "as instructed", "the outline",
                "reference.md", "source notes", "writing rule", "planned run", "pending result", "will be benchmarked"]

[[style.warn]]                             # en-GB spelling of ordinary words; names (International Organization for Standardization) and quotations keep theirs
pattern = '\b(?!(?:size|sizes|sized|resize|resized|resizing|seize|seized|prize|prizes|capsize)\b)[a-z]+iz(?:e|es|ed|ing|ation|ations)\b'
message = "US spelling; en-GB writes -ise / -isation"

# A conclusion states what is now known about the subject; it does not narrate the report (check_style.py)
[style.conclusion]
headings = ["Conclusion"]                  # a part whose H1 contains one of these words
phrases = ["the report", "this report", "each part", "the four parts", "the three parts", "these parts",
           "this part", "the parts of", "draws these threads", "this conclusion"]
subject = '(?:^|[.;:!?]\s+)(?:Parts?|Sections?) \d'   # a part or section as the subject of a sentence (warning)
